<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: Canvas; color: CanvasText; font: 15px system-ui, sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #setup { display: none; height: 100%; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    #setup.show { display: flex; }
    button { font: inherit; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="setup">
    <div>No page set yet for your new tabs.</div>
    <button id="open-options">Choose a page</button>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
